[package]
name = "fluxtex-app"
version = "0.1.0"
edition = "2021"

[dependencies]
floem = "0.2.0"
tectonic = "0.16"
# pdfium-render requires native library, we will mention this in README
pdfium-render = "0.8"
syntect = "5.2"
cola = { package = "cola-crdt", version = "0.1.1", features = ["serde"] }
datachannel = "0.15"
tokio = { version = "1", features = ["full", "sync", "time"] }
tokio-tungstenite = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "2.0.0-rc.3"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
crossbeam-channel = "0.5" # optional for thread comms if std::sync::mpsc isn't enough
image = "0.25.10"
similar = "3.1.0"
# need to add regex for syntect if not bundled or other text stuff
