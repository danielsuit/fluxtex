[package]
name = "fluxtex-app"
version = "0.1.0"
edition = "2021"

[dependencies]
aldutex = { path = "../../vendor/aldutex" }
fluxtex-signal = { path = "../fluxtex-signal" }
floem = "0.2.0"
pdfium-render = "0.8"
cola = { package = "cola-crdt", version = "0.1.1", features = ["serde", "encode"] }
datachannel = "0.15"
tokio = { version = "1", features = ["full", "sync", "time"] }
tokio-tungstenite = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
crossbeam-channel = "0.5"
image = "0.25.10"
similar = "3.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSObject", "NSString", "NSThread", "NSNotification"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication"] }
